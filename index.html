<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Drone War</title><style>html,body{margin:0;width:100%;height:100%;background:#06111d;color:#fff;font-family:system-ui}#boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#06111d}.spin{width:40px;height:40px;border:4px solid #ffffff22;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;margin:auto auto 14px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div id="boot"><div><div class="spin"></div>Drone War yükleniyor…</div></div><script>(async()=>{try{const n=8;let b='';for(let i=1;i<=n;i++)b+=await(await fetch(`game.part${i}.txt`)).text();const raw=Uint8Array.from(atob(b.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([raw]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div>Oyun yüklenemedi.<br><small>'+String(e)+'</small></div>'}})();</script></body></html>
